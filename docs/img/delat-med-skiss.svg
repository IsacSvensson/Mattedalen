<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="Nunito, sans-serif">
  <!-- Skiss: en ruta i odlingslådan. Plantan visar gånger, blommor och frukt visar delat med. -->
  <defs>
    <g id="bush">
      <path d="M11 31a6.5 6.5 0 0 1-1.5-11.5A9 9 0 0 1 20 9a9 9 0 0 1 10.5 10.5A6.5 6.5 0 0 1 29 31Z" fill="#8fd06c" stroke="#3a2a22" stroke-width="2" stroke-linejoin="round"/>
    </g>
    <g id="tree">
      <path d="M18 33V22h4v11Z" fill="#a8703f" stroke="#3a2a22" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="20" cy="15" r="10.5" fill="#5aa152" stroke="#3a2a22" stroke-width="2"/>
    </g>
    <g id="blossom">
      <circle r="1.9" cx="0" cy="-1.7" fill="#fff"/><circle r="1.9" cx="1.6" cy="-0.5" fill="#fff"/><circle r="1.9" cx="1" cy="1.4" fill="#fff"/><circle r="1.9" cx="-1" cy="1.4" fill="#fff"/><circle r="1.9" cx="-1.6" cy="-0.5" fill="#fff"/>
      <circle r="1.1" fill="#ffcf4a"/>
    </g>
    <circle id="kart" r="2" fill="#c7e07a" stroke="#3a2a22" stroke-width="0.9"/>
    <circle id="berry" r="2.3" fill="#e05a30" stroke="#3a2a22" stroke-width="0.9"/>
    <g id="apple"><circle r="2.8" fill="#e05a30" stroke="#3a2a22" stroke-width="1"/><path d="M0 -2.8v-1.6" stroke="#3a2a22" stroke-width="0.9"/></g>
    <rect id="cell" width="40" height="40" rx="6" fill="#4f3420"/>
  </defs>
  <rect width="560" height="300" fill="#fff6e6"/>
  <text x="20" y="28" font-size="15" font-weight="800" fill="#3a2a22">Plantan visar gånger. Blommor och frukt visar delat med.</text>
  <g font-size="12" fill="#6f5b4b" font-weight="700">
    <text x="160" y="62" text-anchor="middle">inte påbörjat</text>
    <text x="270" y="62" text-anchor="middle">övas: blommor</text>
    <text x="380" y="62" text-anchor="middle">flytande: kart</text>
    <text x="490" y="62" text-anchor="middle">automatiserat:</text>
    <text x="490" y="76" text-anchor="middle">mogen frukt</text>
    <text x="20" y="140" font-size="13" fill="#3a2a22">Buske</text>
    <text x="20" y="152" font-size="11">(gånger</text>
    <text x="20" y="164" font-size="11">flytande)</text>
    <text x="20" y="240" font-size="13" fill="#3a2a22">Träd</text>
    <text x="20" y="252" font-size="11">(gånger</text>
    <text x="20" y="264" font-size="11">automatiserat)</text>
  </g>
  <!-- buske -->
  <g transform="translate(120 90) scale(2)"><use href="#cell"/><use href="#bush"/></g>
  <g transform="translate(230 90) scale(2)"><use href="#cell"/><use href="#bush"/><use href="#blossom" x="15.5" y="21"/><use href="#blossom" x="23" y="16"/><use href="#blossom" x="25" y="25"/></g>
  <g transform="translate(340 90) scale(2)"><use href="#cell"/><use href="#bush"/><use href="#kart" x="15.5" y="22"/><use href="#kart" x="23" y="17"/><use href="#kart" x="25" y="25"/></g>
  <g transform="translate(450 90) scale(2)"><use href="#cell"/><use href="#bush"/><use href="#berry" x="15.5" y="22"/><use href="#berry" x="23" y="17"/><use href="#berry" x="25" y="25"/></g>
  <!-- träd -->
  <g transform="translate(120 192) scale(2)"><use href="#cell"/><use href="#tree"/></g>
  <g transform="translate(230 192) scale(2)"><use href="#cell"/><use href="#tree"/><use href="#blossom" x="15.5" y="13"/><use href="#blossom" x="24" y="11"/><use href="#blossom" x="23" y="19"/></g>
  <g transform="translate(340 192) scale(2)"><use href="#cell"/><use href="#tree"/><use href="#kart" x="15.5" y="13"/><use href="#kart" x="24" y="11"/><use href="#kart" x="23" y="19"/></g>
  <g transform="translate(450 192) scale(2)"><use href="#cell"/><use href="#tree"/><use href="#apple" x="15.5" y="14"/><use href="#apple" x="24" y="11"/><use href="#apple" x="23" y="20"/></g>
</svg>
